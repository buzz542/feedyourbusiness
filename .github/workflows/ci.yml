name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci --no-audit --no-fund

      # The four compliance gates run first, as named steps, so a violation is obvious in the log.
      - name: compliance:hosts
        run: npm run compliance:hosts
      - name: compliance:deps
        run: npm run compliance:deps
      - name: compliance:schema
        run: npm run compliance:schema
      - name: compliance:copy
        run: npm run compliance:copy

      # Typecheck, lint, format, then every test (unit, database, compliance, hooks).
      - run: npm run check

      # CI never calls live third-party APIs. The build needs no secrets: config is read at request time.
      - name: build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
